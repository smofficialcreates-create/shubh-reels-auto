name: daily-reel

on:
  schedule:
    - cron: "30 12 * * *"        # 12:30 UTC = 18:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the reel but do not post it"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: shubh-reels-upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shubh-reels-upload/requirements.txt

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-inter fonts-liberation fonts-dejavu-core

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-int8

      - run: pip install -r requirements.txt

      - name: Make and post the reel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE }}
          PUBLISH_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry' || vars.PUBLISH_MODE || 'auto' }}
        run: python -m reelbot.main

      - name: Keep the video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            shubh-reels-upload/out/reel.mp4
            shubh-reels-upload/out/script.json
            shubh-reels-upload/out/caption.txt
            shubh-reels-upload/out/cover.jpg
            shubh-reels-upload/out/research.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save posting history
        run: |
          if ! git diff --quiet -- data/history.json; then
            git config user.name  "reel-bot"
            git config user.email "reel-bot@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: record posted reel [skip ci]"
            git push
          fi
