name: weekly-carousel

on:
  schedule:
    - cron: "0 13 * * 0"          # Sunday 13:00 UTC = 18:30 IST; waits until the post time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the slides but do not post them"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekly-carousel
  cancel-in-progress: false

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shubh-reels-upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shubh-reels-upload/requirements.txt

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-inter fonts-liberation fonts-dejavu-core

      - run: pip install numpy Pillow requests

      - name: Make and post the carousel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          POST_AT_IST: ${{ vars.POST_AT_IST || '19:30' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry' || vars.PUBLISH_MODE || 'auto' }}
        run: python -m reelbot.carousel

      - name: Keep the slides for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carousel
          path: shubh-reels-upload/out/carousel
          retention-days: 7
          if-no-files-found: ignore

      - name: Save carousel record
        run: |
          git config user.name  "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "chore: record posted carousel [skip ci]"
            git pull --rebase -q || true
            git push
          fi
